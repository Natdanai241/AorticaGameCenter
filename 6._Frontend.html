<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aortica Game Center</title>
  <meta name="description" content="Aortica Game Center — รวมทุกความสนุก ไว้ในที่เดียว">
  <meta name="theme-color" content="#06050b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!-- Logo symbol + gradient (reused via <use>) -->
  <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c084fc"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/>
      </linearGradient>
      <symbol id="logo-a" viewBox="0 0 64 64">
        <path d="M32 3 61 59H46.5L32 30.5 17.5 59H3Z" fill="url(#ag)"/>
        <path d="M32 9 56 56" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" fill="none"/>
        <path d="M21 46h22l-3.5 6.5h-15Z" fill="#22d3ee"/>
        <circle cx="32" cy="13" r="2.2" fill="#fff"/>
      </symbol>
    </defs>
  </svg>

  <canvas id="energy" aria-hidden="true"></canvas>
  <a class="skip" href="#main">ข้ามไปยังเนื้อหาหลัก</a>

  <header class="topbar" id="topbar" hidden>
    <a href="#/library" class="brand" aria-label="Aortica Game Center หน้าคลังเกม">
      <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-a"/></svg>
        <div><span class="logo-word">AORTICA</span><span class="logo-sub">GAME CENTER</span></div></div>
    </a>
    <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
    <div class="user-chip" id="userChip"></div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก (มือถือ)" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal" aria-modal="true"></dialog>

  <noscript><p class="noscript">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งาน Aortica Game Center</p></noscript>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
